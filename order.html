<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>سفارش سریع - مصطفی ادیب</title>
  <style>
    body{direction:rtl;text-align:right;font-family:tahoma;background:#fff9ff;margin:0;padding:0;}
    .wrapper{max-width:600px;margin:0 auto;padding:15px;}
    input,textarea,select{width:100%;padding:8px;margin:5px 0;border:1px solid #ccc;border-radius:4px;}
    a.button{display:inline-block;background:#25d366;color:#fff;padding:10px 20px;border-radius:4px;text-decoration:none;margin-top:10px;}
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>فرم سفارش</h1>
    <form action="https://wa.me/93701234567" method="get" target="_blank">
      <label>نام و نام خانوادگی:</label>
      <input type="text" name="text" placeholder="مثلاً احمد احمدی" required>
      <label>آدرس:</label>
      <textarea name="text" placeholder="کابل، خیابان ..." required></textarea>
      <label>نام محصول:</label>
      <select name="text">
        <option>رژ لب مات - ۳۵۰ افغانی</option>
      </select>
      <label>تعداد:</label>
      <input type="number" name="text" value="1" min="1">
      <button type="submit" class="button">ارسال به واتس‌اپ</button>
    </form>
    <br>
    <a href="/">← بازگشت به صفحه اصلی</a>
  </div>
</body>
</html>
