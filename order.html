<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>تکمیل خرید – مصطفی ادیب</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--blue:#005eb8;--orange:#ff6900;--grey:#f3f3f3;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:tahoma,arial;}
    body{direction:rtl;background:var(--grey);}
    .checkout{max-width:700px;margin:20px auto;background:#fff;border:1px solid #ddd;border-radius:6px;padding:20px;}
    h2{margin-bottom:15px;color:var(--blue);}
    label{font-weight:bold;margin-top:10px;display:block;}
    input,textarea,select{width:100%;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:4px;}
    .btn-submit{display:block;width:100%;background:var(--orange);color:#fff;padding:12px;border:none;border-radius:4px;font-size:1.1rem;margin-top:15px;cursor:pointer;}
    .btn-submit:hover{background:#e55e00;}
    footer{background:#232f3e;color:#ccc;text-align:center;padding:15px;font-size:.8rem;margin-top:20px;}
  </style>
</head>
<body>
  <div class="checkout">
    <h2>تکمیل سفارش</h2>
    <form action="https://wa.me/93792149150" method="get" target="_blank">
      <label>نام و نام خانوادگی</label>
      <input type="text" name="text" placeholder="مثلاً احمد احمدی" required>

      <label>شماره تماس</label>
      <input type="tel" name="text" placeholder="۰۷۰۰xxxxxxx" required>

      <label>آدرس کامل</label>
      <textarea name="text" rows="3" placeholder="استان، شهر، خیابان، کوچه، پلاک" required></textarea>

      <label>محصول</label>
      <select name="text">
        <option>رژ لب مات – ۳۵۰ افغانی</option>
      </select>

      <label>تعداد</label>
      <input type="number" name="text" value="1" min="1" required>

      <label>کد تخفیف (اختیاری)</label>
      <input type="text" name="text" placeholder="اگر دارید وارد کنید">

      <button type="submit" class="btn-submit">ارسال سفارش به واتس‌اپ</button>
    </form>
  </div>

  <footer>
    <a href="/" style="color:#ccc;">← بازگشت به صفحه اصلی</a> | © 2025 فروشگاه مصطفی ادیب
  </footer>
</body>
</html>
