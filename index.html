<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>فروشگاه مصطفی ادیب</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <div id="header"></div>

  <!-- اسلایدر خودکار -->
  <div class="slider">
    <div class="slides">
      <img src="assets/images/slide1.jpg" alt="اسلاید ۱">
      <img src="assets/images/slide2.jpg" alt="اسلاید ۲">
      <img src="assets/images/slide3.jpg" alt="اسلاید ۳">
    </div>
    <button class="slider-btn prev" onclick="showSlide(index-1)">‹</button>
    <button class="slider-btn next" onclick="showSlide(index+1)">›</button>
  </div>

  <!-- ۴ کته‌گوری -->
  <div class="categories">
    <div class="cat-card" onclick="filterCat('hot')">
      <img src="assets/images/cat-hot.jpg" width="100%" alt="پرفروش‌ترین‌ها">
      <div class="cat-title">پرفروش‌ترین‌ها</div>
    </div>
    <div class="cat-card" onclick="filterCat('makeup')">
      <img src="assets/images/cat-makeup.jpg" width="100%" alt="محصولات آرایشی">
      <div class="cat-title">محصولات آرایشی</div>
    </div>
    <div class="cat-card" onclick="filterCat('hygiene')">
      <img src="assets/images/cat-hygiene.jpg" width="100%" alt="محصولات بهداشتی">
      <div class="cat-title">محصولات بهداشتی</div>
    </div>
    <div class="cat-card" onclick="filterCat('care')">
      <img src="assets/images/cat-care.jpg" width="100%" alt="محصولات مراقبتی">
      <div class="cat-title">محصولات مراقبتی</div>
    </div>
  </div>

  <!-- ۳ محصول در ردیف – خودکار از localStorage -->
  <h2 style="text-align:center;margin:20px 0;color:var(--blue);">محصولات ما</h2>
  <div class="prod-row" id="prodRow"></div>

  <div id="footer"></div>

  <script src="assets/js/main.js"></script>
  <script>
    // خواندن محصولات از localStorage (داشبورد ذخیره می‌کند)
    function getProducts() {
      return JSON.parse(localStorage.getItem('ma-products')) || [];
    }
    function renderProducts(cat = 'all') {
      const rows = getProducts();
      const filtered = cat === 'all' ? rows : rows.filter(p => p.cat === cat);
      const row = document.getElementById('prodRow');
      row.innerHTML = '';
      filtered.forEach(p => {
        row.insertAdjacentHTML('beforeend', `
          <div class="prod-card">
            <img src="${p.img}" alt="${p.name}">
            <div class="prod-info">
              <div class="prod-name">${p.name}</div>
              <div class="prod-price">${p.price} افغانی</div>
