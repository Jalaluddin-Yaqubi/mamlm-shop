<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>فروشگاه مصطفی ادیب</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/css/main.css">
  <meta name="description" content="خرید آنلاین محصولات آرایشی و بهداشتی با قیمت عمده – تحویل سریع در سراسر افغانستان">
<meta property="og:title" content="فروشگاه مصطفی ادیب">
<meta property="og:description" content="ارسال سریع – پرداخت در محل – ضمانت بازگشت">
<meta property="og:image" content="https://jalaluddin-yaqubi.github.io/mamlm-shop/assets/images/logo.jpg">
</head>
<body>
  <div id="header"></div>

  <!-- بنر سبز -->
  <div class="banner">
    تحویل سریع در سراسر افغانستان | پرداخت در محل یا آنلاین
  </div>

  <!-- اسلایدر اختیاری (اگر تصویر گذاشتی نمایش داده می‌شود) -->
  <div class="slider" style="display:none;">
    <div class="slides">
      <img src="assets/images/slide1.jpg" alt="اسلاید ۱">
      <img src="assets/images/slide2.jpg" alt="اسلاید ۲">
      <img src="assets/images/slide3.jpg" alt="اسلاید ۳">
    </div>
    <button class="slider-btn prev" onclick="showSlide(index-1)">‹</button>
    <button class="slider-btn next" onclick="showSlide(index+1)">›</button>
  </div>

  <!-- ۴ کته‌گوری -->
  <div class="categories">
    <div class="cat-card" onclick="filterCat('hot')">
      <div class="cat-icon">🔥</div>
      <div class="cat-title">پرفروش‌ترین‌ها</div>
    </div>
    <div class="cat-card" onclick="filterCat('makeup')">
      <div class="cat-icon">💄</div>
      <div class="cat-title">محصولات آرایشی</div>
    </div>
    <div class="cat-card" onclick="filterCat('hygiene')">
      <div class="cat-icon">🧼</div>
      <div class="cat-title">محصولات بهداشتی</div>
    </div>
    <div class="cat-card" onclick="filterCat('care')">
      <div class="cat-icon">🌿</div>
      <div class="cat-title">محصولات مراقبتی</div>
    </div>
  </div>

  <!-- ۳ محصول در ردیف – خودکار از داشبورد -->
  <h2 style="text-align:center;margin:20px 0;color:var(--green);">محصولات ما</h2>
  <div class="prod-row" id="prodRow"></div>

  <div id="footer"></div>

  <script src="assets/js/main.js"></script>
  <script>
    // خواندن محصولات از localStorage (داشبورد ذخیره می‌کند)
    function getProducts() {
      return JSON.parse(localStorage.getItem('ma-products')) || [];
    }
    function saveProducts(p) {
      localStorage.setItem('ma-products', JSON.stringify(p));
    }
    function renderProducts(cat = 'all') {
      const rows = getProducts();
      const filtered = cat === 'all' ? rows : rows.filter(p => p.cat === cat);
      const row = document.getElementById('prodRow');
      row.innerHTML = '';
      filtered.forEach(p => {
        row.insertAdjacentHTML('beforeend', `
          <div class="prod-card">
            <img src="${p.img}" alt="${p.name}">
            <div class="prod-info">
              <div class="prod-name">${p.name}</div>
              <div class="prod-price">${p.price} افغانی</div>
              <button class="prod-btn" onclick="addToCart('${p.name}',${p.price},'${p.img}')">افزودن به سبد</button>
            </div>
          </div>
        `);
      });
    }
    // نمایش اولیه
    renderProducts('all');

    // فیلتر کته‌گوری
    function filterCat(cat) {
      renderProducts(cat);
    }
  </script>
</body>
</html>
