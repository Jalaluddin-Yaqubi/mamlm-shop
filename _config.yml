title: فروشگاه مام‌لِم
description: محصولات آرایشی و بهداشتی با قیمت عمده
lang: fa
baseurl: ""
url: "https://jalaluddin-yaqubi.github.io"
lang: fa
theme: minima

plugins:
  - jekyll-feed
  - jekyll-sitemap

collections:
  products:
    output: true
    permalink: /:collection/:name/

defaults:
  - scope:
      path: ""
      type: products
    values:
      layout: product
  sass:
  style: compressed

head_scripts:
  - /assets/css/style.css
  - /_includes/head-custom.html
defaults:
  - scope:
      path: ""
    values:
      layout: default-rtl
