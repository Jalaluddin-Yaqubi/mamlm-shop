<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>جزئیات محصول – مصطفی ادیب</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <div id="header"></div>

  <div class="container">
    <div class="row">
      <div class="col-left">
        <h1 id="productName">نام محصول</h1>
        <img id="productImg" class="main-img" src="assets/images/hairline powder.jpg" alt="محصول">
      </div>

      <div class="col-right">
        <div class="buy-box">
          <div id="productPrice" class="price">۰ افغانی</div>
          <div>✅ تحویل سریع در کابل</div>
          <div>✅ امکان بازگشت در ۷ روز</div>
          <button class="buy-btn" onclick="addToCartFromDetail()">افزودن به سبد و پرداخت</button>
        </div>

        <div class="specs">
          <strong>ویژگی‌ها:</strong><br>
          - ماندگاری ۲۴ ساعت<br>
          - ضد آب<br>
          - حاوی ویتامین E
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="assets/js/main.js"></script>
  <script>
    // خواندن پارامترهای URL جهت نمایش محصول صحیح
    const params = new URLSearchParams(location.search);
    const name = params.get('name') || 'محصول';
    const price = params.get('price') || '0';
    const img = params.get('img') || 'assets/images/hairline powder.jpg';

    document.getElementById('productName').textContent = name;
    document.getElementById('productPrice').textContent = price + ' افغانی';
    document.getElementById('productImg').src = img;

    function addToCartFromDetail() {
      addToCart(name, price, img);
      location.href = 'https://wa.me/93792149150?text=' +
        encodeURIComponent(`سلام، ${name} به قیمت ${price} افغانی را می‌خوام`);
    }
  </script>
</body>
</html>
