<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>داشبورد – مصطفی ادیب</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <div id="header"></div>

  <div class="dashboard">
    <h2>داشبورد فروشگاه</h2>
    <button onclick="applyDiscount()" style="background:var(--orange);color:#fff;padding:8px 16px;border:none;border-radius:4px;cursor:pointer;">کد تخفیف جدید</button>

    <h3>سبد خرید فعلی</h3>
    <div id="cartView"></div>

    <h3>آمار امروز</h3>
    <ul>
      <li>تعداد بازدید: <span id="visitCount">0</span></li>
      <li>تعداد سفارشات: <span id="orderCount">0</span></li>
    </ul>
  </div>

  <div id="footer"></div>

  <script src="assets/js/main.js"></script>
  <script>
    // نمایش سبد
    function showCart() {
      const cart = getCart();
      const view = document.getElementById('cartView');
      if (!cart.length) view.innerHTML = '<p>سبد خالی است.</p>';
      else {
        let html = '<ul>';
        cart.forEach(i => {
          html += `<li>${i.name} × ${i.qty} = ${i.price * i.qty} افغانی</li>`;
        });
        html += '</ul>';
        view.innerHTML = html;
      }
    }
    showCart();
  </script>
</body>
</html>
