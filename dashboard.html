<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>داشبورد – مصطفی ادیب</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <div id="header"></div>

  <div class="dashboard">
    <h2>داشبورد مدیریت محصولات</h2>

    <form id="prodForm">
      <label>نام محصول:</label>
      <input type="text" id="pName" required>

      <label>قیمت (افغانی):</label>
      <input type="number" id="pPrice" required>

      <label>تصویر (نام فایل داخل images):</label>
      <input type="text" id="pImg" placeholder="مثلاً product-05.jpg" required>

      <label>کته‌گوری:</label>
      <select id="pCat">
        <option value="hot">پرفروش‌ترین‌ها</option>
        <option value="makeup">محصولات آرایشی</option>
        <option value="hygiene">محصولات بهداشتی</option>
        <option value="care">محصولات مراقبتی</option>
      </select>

      <button type="submit" style="background:var(--orange);color:#fff;padding:10px 20px;border:none;border-radius:4px;cursor:pointer;margin-top:10px;">افزودن محصول</button>
    </form>

    <h3>محصولات موجود</h3>
    <div id="prodList"></div>
  </div>

  <div id="footer"></div>

  <script src="assets/js/main.js
